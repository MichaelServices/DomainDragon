<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blocked — Scam Detected</title>
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <div class="container">
    <img src="icons/icon128.png" alt="Blocked" class="logo" />
    <h1>Oh No!</h1>
    <p class="big">This website was a scam and was trying to steal your information or worse your IP.</p>
    <p id="orig"></p>
    <div class="actions">
      <button id="goHome">Go to Safety (New Tab)</button>
      <button id="openAnyway">Open Original Site (Unsafe)</button>
      <button id="report">Report this site</button>
    </div>
    <p class="note">If this is a false positive, open Options and remove the pattern from your blocklist.</p>
  </div>

  <script>
    // Read original URL from query string
    function qs(name) {
      const params = new URLSearchParams(location.search);
      return params.get(name);
    }
    const orig = qs('orig') || '';
    document.getElementById('orig').textContent = orig ? ("Original URL: " + orig) : '';

    document.getElementById('goHome').addEventListener('click', () => {
      // open new safe tab to about:blank and close current tab
      chrome.tabs.create({ url: 'about:blank' }, () => {
        chrome.tabs.getCurrent(curr => {
          if (curr && curr.id) chrome.tabs.remove(curr.id);
        });
      });
    });

    document.getElementById('openAnyway').addEventListener('click', () => {
      // Navigate this tab back to the original URL (user chose to proceed)
      if (orig) {
        chrome.tabs.getCurrent(curr => {
          if (curr && curr.id) chrome.tabs.update(curr.id, { url: orig });
        });
      }
    });

    document.getElementById('report').addEventListener('click', () => {
      // Open options so user can copy the URL and report externally
      chrome.runtime.openOptionsPage();
    });
  </script>
</body>
</html>
